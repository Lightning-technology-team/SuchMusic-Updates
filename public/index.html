<!doctype html>
<html lang="zh-CN">
<head>

<style>

  *{box-sizing:border-box}

  .links{margin-top:22px;font-size:13px;color:var(--muted)}
  .links a{color:var(--accent);text-decoration:none;margin:0 8px}

</style>
</head>
<body>
  <main class="card">
    <h1>Such Music 概念版</h1>
    <div class="ver" id="ver">加载中…</div>

      <a href="./update.json">更新清单 update.json</a>
    </div>

  </main>
  <script>
    fetch('./update.json').then(r=>r.json()).then(d=>{

</body>
</html>
